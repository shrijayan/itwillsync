name: Dependabot Auto-Merge

# pull_request_target, not pull_request: GitHub treats ANY workflow run triggered by a
# Dependabot pull_request/push/pull_request_review(_comment) event as if it came from a
# fork - it gets a read-only GITHUB_TOKEN and NO access to any repo secrets at all,
# regardless of what `permissions:`/`env:` this file declares (confirmed via GitHub's own
# docs: "Troubleshooting Dependabot on GitHub Actions"). That silently made every step
# below a no-op since this workflow was added - `gh run list` showed zero runs, ever, even
# though the branch and PRs looked otherwise fine. pull_request_target is exempt from that
# restriction and gets normal repo-level permissions/secrets. This is the textbook-safe use
# of pull_request_target (unlike the common misuse of it): there is no `actions/checkout`
# step here, so no untrusted PR code is ever checked out or executed with these elevated
# permissions - every step only calls the `gh` CLI against the PR's metadata/API.
on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Log update info
        run: |
          echo "Dependency: ${{ steps.metadata.outputs.dependency-names }}"
          echo "Update type: ${{ steps.metadata.outputs.update-type }}"

      # Only patch/minor bumps merge unattended; majors wait for a human.
      #
      # main's ruleset requires 1 approving review + rebase-only merge.
      # RELEASE_TOKEN is the repo admin's PAT, which has "always" bypass on
      # that ruleset, but it lacks pull-request review scope, so approving
      # fails ("Resource not accessible by personal access token") and
      # `--auto` would wait forever on the review rule. Instead: wait for the
      # required CI checks to pass, then merge with --admin (bypass).
      - name: Wait for required checks
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          sleep 30
          gh pr checks "$PR_URL" --required --watch --fail-fast --interval 30
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Merge (rebase, admin bypass)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --rebase --admin "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
